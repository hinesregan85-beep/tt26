<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Thames to Tallinn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#17212C; --muted:#5A6672; --line:#D6DCE2; --soft:#E7EBEF;
  --land:#DCE2E8; --landline:#C3CCD5; --sea:#F2F4F6;
  --a:#4f7fbf;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --card:#161E27; --ink:#E7ECF1; --muted:#95A2AF; --line:#27323D; --soft:#1C2631;
    --land:#1E2833; --landline:#2E3B48; --sea:#0F151C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --card:#161E27; --ink:#E7ECF1; --muted:#95A2AF; --line:#27323D; --soft:#1C2631;
  --land:#1E2833; --landline:#2E3B48; --sea:#0F151C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;transition:background .6s}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:4px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .where{flex:1;min-width:0;line-height:1.2}
.bar .where b{font-family:var(--serif);font-weight:400;font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where span{font-size:13px;color:var(--muted)}
.bar .dot{width:10px;height:10px;border-radius:50%;background:var(--a);flex:none;transition:background .4s}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--a);border-color:var(--a);color:#fff}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--a);width:0;transition:width .2s,background .4s}

/* layout */
.wrap{display:block}
.mapcol{display:none}
@media (min-width:1000px){
  .wrap{display:grid;grid-template-columns:minmax(380px,44%) 1fr}
  .mapcol{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);height:calc(100vh - 57px - env(safe-area-inset-top,0px));padding:24px;border-right:1px solid var(--line)}
  .mapcol svg{width:100%;height:100%}
  .heromap{display:none}
  .mini{display:none !important}
}
main{min-width:0}

/* hero */
.hero{padding:40px 20px 24px;max-width:760px;margin:0 auto}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,11vw,96px);line-height:.95;letter-spacing:-.02em;margin:0 0 20px}
.hero h1 span{display:block}
.hero .lede{font-size:19px;max-width:34em;margin:0 0 6px}
.hero .count{color:var(--muted);margin:0 0 20px}
.heromap{margin:8px -8px 0}
.heromap svg{width:100%;height:auto;max-height:70vh}
.legs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0;padding:0;list-style:none}
.legs a{display:inline-block;text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.legs a::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}

.tobook{max-width:760px;margin:8px auto 0;padding:18px 20px;border-top:1px solid var(--line)}
.tobook h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 4px}
.tobook p{margin:0 0 10px;color:var(--muted);font-size:15px}
.tobook ul{margin:0;padding:0;list-style:none}
.tobook li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:15px}
.tobook li a{text-decoration:none}
.tobook li span{color:var(--muted);min-width:92px}

/* map */
.land{fill:var(--land);stroke:var(--landline);stroke-width:.8;stroke-linejoin:round}
.seg{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;opacity:.55}
.seg.air{stroke-dasharray:2 7}
.seg.done{stroke:var(--a);opacity:1;stroke-width:3}
.seg.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.4s cubic-bezier(.6,0,.3,1) forwards;animation-delay:var(--dl)}
@keyframes draw{to{stroke-dashoffset:0}}
.cdot{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.clab{font:600 15px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.you{transition:transform .9s cubic-bezier(.5,0,.2,1)}
.you circle.ring{fill:var(--a);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2s infinite}
.you circle.core{fill:var(--a);stroke:#fff;stroke-width:2.5}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.2);opacity:0}}
.offmap{font:500 14px var(--sans);fill:var(--muted)}
@media (max-width:999px){.heromap .clab{font-size:26px;stroke-width:6px}.heromap .cdot{r:7}.heromap .offmap{font-size:22px}.heromap .seg{stroke-width:3.5}.heromap .seg.done{stroke-width:5}.heromap .you .core{r:13}.heromap .you .ring{r:22}}

/* city */
.city{position:relative;margin-top:40px}
.cityhero{position:relative;min-height:62vh;display:flex;align-items:flex-end;overflow:hidden;background:var(--soft)}
.cityhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cityhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.72))}
.cityhero .t{position:relative;z-index:1;padding:24px 20px;color:#fff;max-width:760px;width:100%;margin:0 auto}
.cityhero h2{font-family:var(--serif);font-weight:400;font-size:clamp(56px,15vw,124px);line-height:.9;margin:0;letter-spacing:-.02em}
.cityhero .sub{font-size:16px;opacity:.92;margin-top:8px}
.cityhero.plain{min-height:auto;background:none}
.cityhero.plain::after{display:none}
.cityhero.plain .t{color:var(--ink);padding-top:16px;padding-bottom:0}
.cityhero.plain h2{font-size:clamp(44px,11vw,80px)}
.cityintro{max-width:760px;margin:0 auto;padding:18px 20px 0;display:flex;gap:16px;align-items:flex-start}
.cityintro p{margin:0;font-size:19px;flex:1}
.cityintro .stay{font-size:15px;color:var(--muted);margin-top:8px}
.mini{width:92px;flex:none;border-radius:10px;background:var(--soft);padding:4px}
.mini svg{width:100%;height:auto;display:block}
.mini .land{stroke-width:2}
.mini .pin{fill:var(--a);stroke:#fff;stroke-width:6}

/* day */
.day{max-width:760px;margin:0 auto;padding:30px 20px 8px;border-bottom:1px solid var(--line)}
.dhead{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.date{grid-row:span 2;text-align:center;min-width:58px;padding-top:2px}
.date .n{font-family:var(--serif);font-size:44px;line-height:1;display:block}
.date .m{font-size:13px;color:var(--muted);font-weight:600}
.dhead h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;margin:0}
.dmeta{font-size:14px;color:var(--muted)}
.dmeta a{text-decoration:none;border-bottom:1px solid var(--line)}
.dmeta .k{color:var(--a);font-weight:600}
.day.today .date .n{color:var(--a)}
.todaytag{display:inline-block;font-size:12px;font-weight:700;background:var(--a);color:#fff;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}

/* ticket */
.ticket{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0 4px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--a);border-radius:12px;padding:14px 16px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;right:120px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket .p small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.ticket .p b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.15}
.ticket .p span{font-size:14px;color:var(--muted)}
.ticket .p.to{text-align:right}
.ticket .mode{text-align:center;font-size:12px;font-weight:700;color:var(--a);line-height:1.2}
.ticket .mode svg{display:block;margin:0 auto 4px;width:40px;height:12px}
.ticket .note{grid-column:1/-1;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.ticket img{grid-column:1/-1;border-radius:8px;aspect-ratio:16/7;object-fit:cover;width:100%;background:var(--soft)}
@media (max-width:420px){.ticket::before,.ticket::after{right:90px}}

/* photos */
.photos{display:grid;gap:6px;margin:18px 0 6px;grid-template-columns:repeat(var(--n),1fr)}
.photos figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:var(--soft)}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;opacity:0;transition:opacity .6s}
.photos[style*="--n:1"] img{aspect-ratio:16/9}
.photos img.in,.cityhero img.in,.ticket img.in{opacity:1}
.cityhero img,.ticket img{opacity:0;transition:opacity .8s}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
@media (max-width:520px){.photos[style*="--n:3"]{grid-template-columns:1fr 1fr}.photos[style*="--n:3"] figure:first-child{grid-column:1/-1}.photos[style*="--n:3"] figure:first-child img{aspect-ratio:16/9}}

/* slots */
.slots{margin:14px 0 0;padding:0}
.slot{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--soft)}
.slot dt{font-size:14px;font-weight:700;color:var(--muted);padding-top:2px}
.slot dd{margin:0}
.notes{margin:10px 0 0;padding:0;display:grid;gap:8px}
.notes div{display:grid;grid-template-columns:86px 1fr;gap:12px;font-size:15px}
.notes dt{font-size:14px;font-weight:700;color:var(--muted)}
.notes dd{margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);text-decoration:none;line-height:1.3}
.chip.ok{border-color:color-mix(in srgb,#2f8a4f 45%,var(--line));color:#2f8a4f;background:color-mix(in srgb,#2f8a4f 8%,var(--card))}
.chip.todo{border-color:color-mix(in srgb,#c47b12 55%,var(--line));color:#b06d0c;background:color-mix(in srgb,#c47b12 9%,var(--card))}
:root[data-theme="dark"] .chip.ok{color:#6fd096}
:root[data-theme="dark"] .chip.todo{color:#f0b35a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.ok{color:#6fd096}:root:not([data-theme="light"]) .chip.todo{color:#f0b35a}}
.chip.map::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--a);margin-right:6px;vertical-align:1px}
.daynum{font-size:12px;color:var(--muted);margin:0 0 6px}

.dnotes{margin:0 0 22px}
.dnotes label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.dnotes textarea{display:block;width:100%;min-height:76px;font:16px/1.5 var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.dnotes textarea::placeholder{color:var(--muted)}
.dnotes .st{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px}
.notesbox{margin-top:18px}
.notesbox .st{font-size:13px;color:var(--muted);margin-left:10px}
.end{max-width:760px;margin:0 auto;padding:60px 20px 30px}
.end h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,10vw,72px);line-height:1;margin:0 0 12px}
.credits{max-width:760px;margin:0 auto;padding:10px 20px 60px;font-size:12px;color:var(--muted)}
.credits summary{cursor:pointer;font-weight:600;font-size:14px}
.credits li{margin:3px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (min-width:1000px){.fab{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.seg.draw{stroke-dashoffset:0}.photos img,.cityhero img,.ticket img{opacity:1}}
</style>
</head>

03": "img/d1103.webp", "d1120": "img/d1120.webp", "d1103b": "img/d1103b.webp", "d1102": "img/d1102.webp", "d1121b": "img/d1121b.webp", "h_normandy": "img/h_normandy.webp", "d1206b": "img/d1206b.webp", "h_brussels": "img/h_brussels.webp", "d1204": "img/d1204.webp", "d1119": "img/d1119.webp", "d1113b": "img/d1113b.webp", "d1024": "img/d1024.webp", "d1120b": "img/d1120b.webp", "d1128": "img/d1128.webp", "h_london": "img/h_london.webp", "d1027": "img/d1027.webp", "d1203": "img/d1203.webp", "d1114b": "img/d1114b.webp", "h_milan": "img/h_milan.webp", "d1025": "img/d1025.webp", "d1101": "img/d1101.webp", "h_vienna": "img/h_vienna.webp", "d1125b": "img/d1125b.webp", "d1112b": "img/d1112b.webp", "d1030b": "img/d1030b.webp", "h_venice": "img/h_venice.webp", "d1026": "img/d1026.webp"};
const {legs,cities,cap,credits}=DATA;
const VB="60 50 860 860";
const ROUTE=[["London","rail"],["Paris","rail"],["Rouen","car"],["Étretat","car"],["Honfleur","car"],["Bayeux","car"],["Mont-Saint-Michel","car"],["Caen","car"],["Paris","car"],["Milan","rail"],["Rome","rail"],["Naples","rail"],["Venice","rail"],["Florence","rail"],["Vienna","rail"],["Munich","rail"],["Neuschwanstein","car"],["Munich","car"],["Tallinn","air"],["Helsinki","ferry"],["Brussels","air"]];
const LABELS=["London","Paris","Honfleur","Bayeux","Mont-Saint-Michel","Milan","Rome","Naples","Venice","Florence","Vienna","Munich","Tallinn","Helsinki","Brussels"];
const LABPOS={"London":[-8,-12,"end"],"Paris":[10,4,"start"],"Honfleur":[-6,-12,"middle"],"Bayeux":[-10,-4,"end"],"Mont-Saint-Michel":[6,20,"start"],"Milan":[-10,-8,"end"],"Rome":[-10,4,"end"],"Naples":[10,10,"start"],"Venice":[10,-6,"start"],"Florence":[10,4,"start"],"Vienna":[10,4,"start"],"Munich":[0,-12,"middle"],"Tallinn":[-10,12,"end"],"Helsinki":[-10,-6,"end"],"Brussels":[10,-4,"start"]};
const el=(t,a={},h="")=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);if(h)e.innerHTML=h;return e};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gmap=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const localISO=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
const TODAY=localISO();
const ALLDAYS=legs.flatMap(l=>l.days.map(d=>({...d,leg:l})));
const FIRST=ALLDAYS[0].date, LAST=ALLDAYS[ALLDAYS.length-1].date;

function mapSVG(svg,{big=true}={}){
  svg.setAttribute("viewBox",VB);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  let s=`<use href="#landp" class="land"/>`;
  let segs="";
  for(let i=1;i<ROUTE.length;i++){
    const [a]=ROUTE[i-1],[b,mode]=ROUTE[i];const p=cities[a],q=cities[b];
    let d;
    if(mode==="air"){const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=q[0]-p[0],dy=q[1]-p[1];d=`M${p[0]} ${p[1]}Q${mx-dy*.18} ${my+dx*.18} ${q[0]} ${q[1]}`}
    else d=`M${p[0]} ${p[1]}L${q[0]} ${q[1]}`;
    segs+=`<path class="seg ${mode==="air"?"air":""}" data-i="${i}" d="${d}"/>`;
  }
  s+=`<g class="segs">${segs}</g>`;
  for(const c of LABELS){const [x,y]=cities[c];const [dx,dy,an]=LABPOS[c];s+=`<circle class="cdot" cx="${x}" cy="${y}" r="5"/><text class="clab" x="${x+dx}" y="${y+dy}" text-anchor="${an}">${c==="Mont-Saint-Michel"?"Mont-St-Michel":c}</text>`}
  if(big){s+=`<text class="offmap" x="80" y="895">Christchurch, Seoul and Hong Kong are off the map</text><g class="you" id="you-${svg.id}"><circle class="ring" r="14"/><circle class="core" r="8"/></g>`}
  svg.innerHTML=s;
}
function animateRoute(svg){
  svg.querySelectorAll(".seg").forEach((p,i)=>{const L=p.getTotalLength();p.style.setProperty("--len",L);p.style.setProperty("--dl",(i*0.11)+"s");if(!p.classList.contains("air"))p.classList.add("draw");else{p.style.opacity=0;setTimeout(()=>p.style.opacity="",i*110+600)}});
}

// hero
const main=document.getElementById("main");
const daysTo=Math.round((pd(FIRST)-pd(TODAY))/864e5);
let countTxt = daysTo>1?`Leaving in ${daysTo} days.`:daysTo===1?"Leaving tomorrow.":daysTo===0?"Leaving today.":(TODAY<=LAST?"On the road now.":"Home again. What a trip.");
const hero=el("section",{class:"hero"},`
<h1><span>The Thames</span><span>to Tallinn</span></h1>
<p class="lede">Regan and Sarah, 23 October to 7 December 2026. London to Brussels by train, ferry and hire car, with Rome, Venice, Vienna and a lot of perfume in between.</p>
<p class="count">${countTxt}</p>
<div class="heromap"><svg id="heromapsvg" role="img" aria-label="Map of the route across Europe"></svg></div>
<ul class="legs">${legs.filter(l=>l.days.length).map(l=>`<li><a href="#c-${l.id}" style="--c:${l.accent}">${esc(l.city)}</a></li>`).join("")}</ul>`);
main.append(hero);

// to book
const todo=ALLDAYS.flatMap(d=>(d.tobook||[]).map(t=>({t,d})));
if(todo.length){
  const tb=el("section",{class:"tobook"},`<h2>Still to book</h2><p>Flagged in the plan as not booked yet.</p><ul>${todo.map(({t,d})=>{const dt=pd(d.date);return `<li><span>${WD[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}</span><a href="#d-${d.date}">${esc(t)}</a></li>`}).join("")}</ul>`);
  main.append(tb);
}

const modeIcon=`<svg viewBox="0 0 40 12" aria-hidden="true"><path d="M2 6h32m-5-4 5 4-5 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let n=0;
for(const l of legs){
  const sec=el("section",{class:"city",id:"c-"+l.id,"data-leg":l.id});
  const hasHero=l.hero&&IMG[l.hero];
  sec.innerHTML=`<div class="cityhero ${hasHero?"":"plain"}">${hasHero?`<img data-k="${l.hero}" alt="${esc(cap[l.hero])}">`:""}<div class="t"><h2>${esc(l.city)}</h2><div class="sub">${esc(l.country)}${l.days.length>1?`, ${l.days.length} days`:""}</div></div></div>`+
   (l.intro||l.hotel?`<div class="cityintro"><div style="flex:1">${l.intro?`<p>${esc(l.intro)}</p>`:""}${l.hotel?`<div class="stay">Staying at <a href="${gmap(l.hotel)}" target="_blank" rel="noopener">${esc(l.hotel)}</a></div>`:""}</div>${l.pos?`<div class="mini" aria-hidden="true"><svg viewBox="${VB}"><use href="#landp" class="land"/><circle class="pin" cx="${cities[l.pos][0]}" cy="${cities[l.pos][1]}" r="26" style="fill:${l.accent}"/></svg></div>`:""}</div>`:"");
  for(const d of l.days){
    n++;
    const dt=pd(d.date);
    const hotel=d.hotel||l.hotel;
    const a=el("article",{class:"day"+(d.date===TODAY?" today":""),id:"d-"+d.date,"data-leg":l.id,"data-pos":d.mappos||l.pos||"","data-n":n});
    let h=`<p class="daynum">Day ${n} of ${ALLDAYS.length}</p><div class="dhead"><div class="date"><span class="n">${dt.getDate()}</span><span class="m">${WD[dt.getDay()]} ${MON[dt.getMonth()]}</span></div><h3>${esc(d.title)}${d.date===TODAY?`<span class="todaytag">Today</span>`:""}</h3>`;
    h+=`<div class="dmeta">${hotel?(/^(In the air|Nightjet)/.test(hotel)?esc(hotel):`<a href="${gmap(hotel)}" target="_blank" rel="noopener">${esc(hotel)}</a>`):""}</div></div>`;
    if(d.travel){const t=d.travel;h+=`<div class="ticket"><div class="p"><small>From</small><b>${esc(t.frm)}</b><span>${esc(t.dep)}</span></div><div class="mode">${modeIcon}${esc(t.mode)}</div><div class="p to"><small>To</small><b>${esc(t.to)}</b><span>${esc(t.arr)}</span></div>${t.note?`<div class="note">${esc(t.note)}</div>`:""}${t.photo&&IMG[t.photo]?`<img data-k="${t.photo}" alt="${esc(cap[t.photo])}">`:""}</div>`}
    const ph=(d.photos||[]).filter(k=>IMG[k]);
    if(ph.length)h+=`<div class="photos" style="--n:${ph.length}">${ph.map(k=>`<figure><img data-k="${k}" alt="${esc(cap[k])}"><figcaption>${esc(cap[k])}</figcaption></figure>`).join("")}</div>`;
    if(d.slots&&d.slots.length)h+=`<dl class="slots">${d.slots.map(([k,v])=>`<div class="slot"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
    const notes=[["Eat",d.food],["If there's time",d.extra],["Shopping",d.shop],["Getting around",d.travelnote]].filter(x=>x[1]);
    if(notes.length)h+=`<dl class="notes">${notes.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
    const chips=[...(d.booked||[]).map(b=>`<span class="chip ok">Booked: ${esc(b)}</span>`),...(d.tobook||[]).map(b=>`<span class="chip todo">To book: ${esc(b)}</span>`),...(d.places||[]).map(p=>`<a class="chip map" href="${gmap(p)}" target="_blank" rel="noopener">${esc(p)}</a>`)];
    h+=chips.length?`<div class="chips">${chips.join("")}</div>`:`<div style="height:14px"></div>`;
    h+=`<div class="dnotes"><label for="n-${d.date}">Notes</label><textarea id="n-${d.date}" data-date="${d.date}" placeholder="Anything to remember for this day"></textarea><div class="st" aria-live="polite"></div></div>`;
    a.innerHTML=h;sec.append(a);
  }
  main.append(sec);
}
main.append(el("section",{class:"end"},`<h2>Home.</h2><p>Forty-six days, eight countries, and a suitcase that probably smells amazing.</p><div class="notesbox"><button class="btn" id="copyNotes" type="button">Copy all notes</button><span class="st" id="copySt" aria-live="polite"></span></div>`));
main.append(el("section",{class:"credits"},`<details><summary>Photo credits</summary><p>Photos from Wikimedia Commons under their stated licences.</p><ul>${credits.map(c=>`<li><a href="${esc(c.u)}" target="_blank" rel="noopener">${esc(c.t)}</a>${c.a?`, ${esc(c.a)}`:""}, ${esc(c.l)}</li>`).join("")}</ul></details>`));


// notes, saved on this device
const NK=d=>"tt-notes-"+d;
const getN=d=>{try{return localStorage.getItem(NK(d))||""}catch(e){return ""}};
const setN=(d,v)=>{try{v?localStorage.setItem(NK(d),v):localStorage.removeItem(NK(d));return true}catch(e){return false}};
document.querySelectorAll(".dnotes textarea").forEach(ta=>{
  ta.value=getN(ta.dataset.date);
  const st=ta.parentElement.querySelector(".st");let tm;
  const fit=()=>{ta.style.height="auto";ta.style.height=Math.max(76,ta.scrollHeight+2)+"px"};fit();
  ta.addEventListener("input",()=>{fit();clearTimeout(tm);st.textContent="Saving";tm=setTimeout(()=>{st.textContent=setN(ta.dataset.date,ta.value.trim())?"Saved on this device":"Couldn't save on this device"},500)});
});
document.getElementById("copyNotes").addEventListener("click",async()=>{
  const lines=ALLDAYS.map(d=>{const v=getN(d.date);if(!v)return null;const dt=pd(d.date);return `${WD[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}, ${d.leg.city}: ${v}`}).filter(Boolean);
  const st=document.getElementById("copySt");
  if(!lines.length){st.textContent="No notes yet";return}
  try{await navigator.clipboard.writeText(lines.join("\n\n"));st.textContent=`Copied notes from ${lines.length} day${lines.length>1?"s":""}`}catch(e){st.textContent="Copy blocked by this browser"}
});

// maps
const big=document.getElementById("bigmap"),hm=document.getElementById("heromapsvg");
mapSVG(big);mapSVG(hm);
requestAnimationFrame(()=>{animateRoute(window.matchMedia("(min-width:1000px)").matches?big:hm)});

// lazy images
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){const i=e.target;i.onload=()=>i.classList.add("in");i.src=IMG[i.dataset.k];if(i.complete)i.classList.add("in");io.unobserve(i)}},{rootMargin:"900px 0px"});
document.querySelectorAll("img[data-k]").forEach(i=>io.observe(i));

// scroll tracking
const bw=document.getElementById("bw"),bd=document.getElementById("bd"),prog=document.getElementById("prog");
const legById=Object.fromEntries(legs.map(l=>[l.id,l]));
const order=ROUTE.map(r=>r[0]);
function routeIndex(pos,date){
  // find the route stop index matching this position, preferring the right visit to Paris/Munich
  if(!pos)return date<FIRST?0:(date>"2026-12-04"?ROUTE.length-1:0);
  if(pos==="Paris")return date>="2026-11-08"?8:1;
  if(pos==="Munich")return date>="2026-11-29"?17:15;
  return Math.max(0,order.indexOf(pos));
}
let current=null;
function setDay(a){
  if(!a||a===current)return;current=a;
  const l=legById[a.dataset.leg];const dt=pd(a.id.slice(2));
  document.documentElement.style.setProperty("--a",l.accent);
  bw.textContent=l.city;bd.textContent=`${WD[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}, day ${a.dataset.n} of ${ALLDAYS.length}`;
  prog.style.width=(a.dataset.n/ALLDAYS.length*100)+"%";
  const pos=a.dataset.pos;let ri=routeIndex(pos,a.id.slice(2));
  if(!pos&&a.id.slice(2)>="2026-12-05")ri=ROUTE.length-1;
  for(const svg of [big,hm]){
    svg.querySelectorAll(".seg").forEach(p=>p.classList.toggle("done",+p.dataset.i<=ri));
    const you=svg.querySelector(".you");const c=cities[pos||ROUTE[ri][0]];
    if(you){you.style.transform=`translate(${c[0]}px,${c[1]}px)`;you.style.opacity=pos?1:.35}
  }
}
const days=[...document.querySelectorAll(".day")];
function onScroll(){
  const y=innerHeight*0.35;let best=null;
  for(const d of days){const r=d.getBoundingClientRect();if(r.top<=y)best=d;else break}
  if(best)setDay(best);
  else{current=null;bw.textContent="The Thames to Tallinn";bd.textContent="23 October to 7 December 2026";prog.style.width="0";document.documentElement.style.setProperty("--a","#4f7fbf");
    for(const svg of [big,hm]){svg.querySelectorAll(".seg").forEach(p=>p.classList.remove("done"));const you=svg.querySelector(".you");if(you){const c=cities.London;you.style.transform=`translate(${c[0]}px,${c[1]}px)`;you.style.opacity=.9}}}
}
addEventListener("scroll",()=>requestAnimationFrame(onScroll),{passive:true});
onScroll();

// today
function goToday(){
  let target=TODAY<FIRST?FIRST:TODAY>LAST?LAST:TODAY;
  const e=document.getElementById("d-"+target);if(e)e.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
const lbl=TODAY<FIRST?"Day one":TODAY>LAST?"Last day":"Today";
for(const b of [document.getElementById("todayBtn"),document.getElementById("fab")]){b.textContent=lbl;b.addEventListener("click",goToday)}
</script>
</body>
